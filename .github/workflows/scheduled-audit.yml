name: Scheduled dependency audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1" # Mondays: depends on the outside world, so it never blocks a change

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements-gui.txt

      - name: Audit dependencies for known vulnerabilities
        run: python -m quality.run --stage scheduled
