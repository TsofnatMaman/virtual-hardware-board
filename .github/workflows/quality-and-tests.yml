name: Code Quality + Tests CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    env:
      # Qt runs headless; a missing tool must fail the run instead of skipping tests.
      QT_QPA_PLATFORM: offscreen
      REQUIRE_FULL_TEST_ENV: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install system packages (ARM toolchain, gdb, Qt runtime libraries)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi make gdb-multiarch \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-gui.txt
          pip install -r requirements-dev.txt

      - name: Run quality checks and tests
        run: python utils/run_quality_checks.py

      - name: Send coverage to Codacy
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          bash <(curl -Ls https://coverage.codacy.com/get.sh) report -r coverage.xml
