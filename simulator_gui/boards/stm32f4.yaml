# STM32F4 Discovery (STM32F407): the four user LEDs are on GPIOD pins 12-15.
# The background is a photo of the real board (372x594). LED positions are in
# pixels of that image; each LED sits on its SMD footprint around the
# accelerometer chip (LD3 top, LD4 left, LD5 right, LD6 bottom).
board_name: STM32F4
background_image: ../assets/stm32f4_discovery.png

canvas:
  width: 372
  height: 594
  scale_mode: fit

fallback_layout:
  area: [20, 520, 330, 50]
  spacing: 12
  item_size: [20, 20]

components:
  - id: led_ld4
    type: LED
    position: [161, 391, 14, 14]      # LD4, green, PD12
    visual:
      on_color: "#22ff66"
      off_color: "#40101810"
      border_color: "#00000000"
    binding:
      address: 0x40020C14             # GPIOD ODR
      mask: 0x1000
      size: 4
      direction: output

  - id: led_ld3
    type: LED
    position: [184, 368, 14, 14]      # LD3, orange, PD13
    visual:
      on_color: "#ff9a00"
      off_color: "#40201000"
      border_color: "#00000000"
    binding:
      address: 0x40020C14
      mask: 0x2000
      size: 4
      direction: output

  - id: led_ld5
    type: LED
    position: [204, 391, 14, 14]      # LD5, red, PD14
    visual:
      on_color: "#ff2a1a"
      off_color: "#40200808"
      border_color: "#00000000"
    binding:
      address: 0x40020C14
      mask: 0x4000
      size: 4
      direction: output

  - id: led_ld6
    type: LED
    position: [184, 413, 14, 14]      # LD6, blue, PD15
    visual:
      on_color: "#3b82ff"
      off_color: "#40081030"
      border_color: "#00000000"
    binding:
      address: 0x40020C14
      mask: 0x8000
      size: 4
      direction: output
